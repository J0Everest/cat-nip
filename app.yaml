command: ["gunicorn", "server.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]

env:
  - name: "DB_SERVER_CURRENT"
    value: "ERRSACTDBP1"
  - name: "DB_CATACCUM_DATABASE"
    value: "CatAccum2604"
  - name: "AIR_EVENTS_DB"
    value: "AIREvents2025_TS13"
  - name: "INDUSTRY_DB"
    value: "Industry"
  - name: "DB_AUTH_MODE"
    value: "sql"
  - name: "ODBC_DRIVER"
    value: "ODBC Driver 18 for SQL Server"
  - name: "DB_ENCRYPT"
    value: "true"
  - name: "DB_TRUST_SERVER_CERT"
    value: "true"
  - name: "DB_PORT"
    value: "1433"
  - name: "DB_CONNECT_TIMEOUT"
    value: "30"
  - name: "DB_USER"
    value: "__SET_IN_DATABRICKS_APP_ENV__"
  - name: "DB_PASSWORD"
    value: "__SET_IN_DATABRICKS_APP_ENV__"
